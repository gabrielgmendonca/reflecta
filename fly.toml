app = "retro-board"
primary_region = "gru"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "retro_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/retro.db"
